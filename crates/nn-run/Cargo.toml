[package]
name = "nn-run"
description = "Ferramenta `nn`: roda e exporta jogos em Lua da nn-engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
default-run = "nn"

[lib]
name = "nn_run"
path = "src/lib.rs"

# Ferramenta de desenvolvimento: roda projetos e exporta jogos.
[[bin]]
name = "nn"
path = "src/main.rs"

# Executável dos jogos exportados (no Windows, sem janela de console).
[[bin]]
name = "nn-jogo"
path = "src/jogo.rs"

[dependencies]
nn-app.workspace = true
nn-script.workspace = true
env_logger.workspace = true
log.workspace = true

[dev-dependencies]
nn-input.workspace = true
serde_json.workspace = true

[lints]
workspace = true
