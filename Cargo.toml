[package]
name = "nn-engine"
description = "Engine 2D em Rust — fachada que reúne todos os módulos da nn-engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
nn-core.workspace = true
nn-input.workspace = true
nn-render.workspace = true
nn-app.workspace = true
nn-audio.workspace = true
nn-script.workspace = true
nn-physics.workspace = true
nn-tilemap.workspace = true
glam.workspace = true

[dev-dependencies]
env_logger.workspace = true

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/nereuneto/nn-engine"

[workspace.dependencies]
nn-core = { path = "crates/nn-core", version = "0.1.0" }
nn-input = { path = "crates/nn-input", version = "0.1.0" }
nn-render = { path = "crates/nn-render", version = "0.1.0" }
nn-app = { path = "crates/nn-app", version = "0.1.0" }
nn-audio = { path = "crates/nn-audio", version = "0.1.0" }
nn-script = { path = "crates/nn-script", version = "0.1.0" }
nn-physics = { path = "crates/nn-physics", version = "0.1.0" }
nn-tilemap = { path = "crates/nn-tilemap", version = "0.1.0" }

wgpu = "30"
winit = "0.30"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdue = "0.9"
# Lua 5.4 compilada junto (vendored): não precisa instalar nada.
mlua = { version = "0.12", features = ["lua54", "vendored"] }
kira = { version = "0.12", default-features = false, features = ["cpal", "wav", "pcm", "ogg", "vorbis", "mp3"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[lints]
workspace = true

# Executáveis de release menores (sem símbolos de depuração).
[profile.release]
strip = true

# Dependências compiladas com otimização mesmo em debug: deixa o renderer
# e o carregamento de imagens rápidos sem perder o debug do nosso código.
[profile.dev.package."*"]
opt-level = 2
