name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Build e testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # Driver Vulkan por software (lavapipe): permite rodar os testes de
      # renderização de verdade no CI, sem GPU física.
      - name: Driver de GPU por software, ALSA e udev
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libasound2-dev libudev-dev
          echo "NN_REQUIRE_GPU=1" >> "$GITHUB_ENV"

      # Os avisos também viram anotações no PR (aparecem na aba de arquivos).
      - name: Clippy
        shell: bash
        run: |
          echo "::notice::$(rustc --version) / $(cargo clippy --version)"
          cargo clippy --workspace --all-targets --color never --message-format=short -- -D warnings 2>&1 | tee clippy.txt \
            || { sed -nE 's/^([^ ]+):([0-9]+):([0-9]+): (error|warning): (.*)$/::error file=\1,line=\2,col=\3::\5/p; /^error/s/^/::error::/p' clippy.txt; exit 1; }
      - name: Build (inclui exemplos)
        run: cargo build --workspace --all-targets
      # Falhas também viram uma anotação no PR (o começo de cada uma).
      - name: Testes
        shell: bash
        run: |
          cargo test --workspace --color never 2>&1 | tee testes.txt || {
            msg=$( { grep -E -A8 "^---- |^failures:|test result: FAILED" testes.txt; grep -E -B2 -A6 "^error: test failed|Caused by|didn't exit successfully" testes.txt; } | head -120 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Testes::$msg"
            exit 1
          }
      - name: Documentação
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # O render no navegador: as cenas de teste (teste-web/) desenhadas no
  # desktop e no Chromium sem tela (WebGL2, por software) precisam bater.
  # Tudo o que entra no render tem de rodar na web (veja docs/estudo-web.md).
  web:
    name: Render no navegador (WebGL2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: teste-web -> target
      - name: Driver de GPU por software e wasm-bindgen
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          echo "WB=$(grep -A1 '^name = "wasm-bindgen"$' teste-web/Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WB }}
      - name: As cenas no desktop (referência)
        working-directory: teste-web
        run: cargo run --release --color never -- referencias fotos/desktop
      - name: A página
        working-directory: teste-web
        run: |
          cargo build --release --color never --target wasm32-unknown-unknown
          wasm-bindgen --target web --no-typescript --out-dir site target/wasm32-unknown-unknown/release/render-web.wasm
          cp index.html site/
      - name: As cenas no Chromium
        working-directory: teste-web
        run: |
          npm i --no-save --silent playwright@1.49.1
          npx playwright install --with-deps chromium > /dev/null
          python3 -m http.server 8000 --directory site > /dev/null 2>&1 &
          sleep 1
          mkdir -p fotos/navegador
          CENAS=$(cargo run --release --color never -q -- cenas)
          N=$(echo "$CENAS" | tr ',' '\n' | wc -l)
          node fotos.mjs http://localhost:8000 "$N" fotos/navegador webgl "$CENAS" | tee webgl.txt
          node fotos.mjs http://localhost:8000 "$N" fotos/navegador webgpu "$CENAS" | tee webgpu.txt || echo "::warning title=WebGPU::$(grep FALHA webgpu.txt | head -3)"
      - name: Comparar
        working-directory: teste-web
        shell: bash
        run: |
          cargo run --release --color never -q -- comparar fotos/desktop fotos/navegador webgl- | tee comparar.txt || {
            echo "::error title=Render no navegador::$(grep -v '^ok' comparar.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
          echo "::notice title=Render no navegador::$(sed ':a;N;$!ba;s/\n/%0A/g' comparar.txt)"
          cargo run --release --color never -q -- comparar fotos/desktop fotos/navegador webgpu- > webgpu-comparar.txt || echo "::warning title=WebGPU::$(sed ':a;N;$!ba;s/\n/%0A/g' webgpu-comparar.txt)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-no-navegador
          path: teste-web/fotos

  msrv:
    name: Versão mínima do Rust (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - name: ALSA
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      # A engine e a ferramenta `nn` seguem no Rust 1.89 (a física 3D, pelo nalgebra, pede o 1.89). O NN Studio (editor)
      # usa a interface egui, que pede o Rust 1.95; ele é testado nos outros jobs.
      - run: cargo check --workspace --all-targets --exclude nn-studio

  clippy-beta:
    name: Clippy do próximo Rust (só aviso)
    runs-on: ubuntu-latest
    # Um lint novo do Rust que vem aí aparece aqui umas semanas antes de
    # chegar ao estável (e quebrar o job de cima), sem bloquear o merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@beta
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: ALSA e udev
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Clippy (beta)
        shell: bash
        run: |
          echo "::notice::$(rustc --version) / $(cargo clippy --version)"
          cargo clippy --workspace --all-targets --color never --message-format=short -- -D warnings 2>&1 | tee clippy.txt \
            || { sed -nE 's/^([^ ]+):([0-9]+):([0-9]+): (error|warning): (.*)$/::warning file=\1,line=\2,col=\3::(Rust beta) \5/p' clippy.txt; exit 1; }
