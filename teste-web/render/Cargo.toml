[package]
name = "render-web"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
nn-core = { path = "../../crates/nn-core" }
nn-render = { path = "../../crates/nn-render" }
glam = "0.34"
log = "0.4"
web-time = "1"
wgpu = { version = "30", features = ["webgl", "fragile-send-sync-non-atomic-wasm"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
winit = "0.30"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Location"] }
console_error_panic_hook = "0.1"
console_log = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
